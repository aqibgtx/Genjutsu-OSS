backend:
  type: comfyui
  url: http://127.0.0.1:8188
  workflow: null
  timeout: 3600
segmentation: { model: opencv, checkpoint: null, device: auto }
tracking: { model: opencv, device: auto }
depth: { model: none, checkpoint: null, device: auto }
pose: { model: none, checkpoint: null, device: auto }
optical_flow: { model: opencv, device: auto }
