temporal: { enabled: true, strength: 0.4, smoothing_strength: 0.25, repair_strength: 0.25 }
compositing: { enabled: true, feather_px: 8, color_match: false }
upscale: { enabled: false, model: realesrgan, scale: 2 }
cache: { directory: .genjutsu-cache, enabled: true }
processing: { chunk_frames: 81, overlap_frames: 9, low_vram: false, cpu_offload: true }
